name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore ABlueRainbowBackend/ABlueRainbowBackend.csproj
      - run: dotnet restore ABlueRainbowBackend.Tests/ABlueRainbowBackend.Tests.csproj
      - run: dotnet build ABlueRainbowBackend/ABlueRainbowBackend.csproj --configuration Release --no-restore
      - run: dotnet test ABlueRainbowBackend.Tests/ABlueRainbowBackend.Tests.csproj --configuration Release --no-restore